name: AppImage Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      VERSION: ${{ github.ref_name }}
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: "desktop"
          install-deps: "true"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dqt6-extra-path=$QT_ROOT_DIR -Dqt6-lib-path=$QT_ROOT_DIR/lib

      - name: Install AppImage build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            patchelf \
            desktop-file-utils \
            fakeroot \
            zsync \
            squashfs-tools
          pip3 install --user appimage-builder
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: appimage-builder --recipe AppImageBuilder.yml --skip-test

      - name: Verify AppImage
        run: |
          ls -la Badi-${{ github.ref_name }}-x86_64.AppImage
          file Badi-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Badi-${{ github.ref_name }}-x86_64
          path: |
            Badi-${{ github.ref_name }}-x86_64.AppImage
            Badi-${{ github.ref_name }}-x86_64.AppImage.zsync

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Badi-${{ github.ref_name }}-x86_64.AppImage
            Badi-${{ github.ref_name }}-x86_64.AppImage.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
