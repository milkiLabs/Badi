name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: latest

      - id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          install-deps: 'false'

      - run: zig build -Doptimize=ReleaseFast -Dqt6-extra-path=${{ steps.install-qt.outputs.qt-path }} -Dqt6-lib-path=${{ steps.install-qt.outputs.qt-path }}/lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: zig-out/
