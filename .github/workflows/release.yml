name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_DIR: /opt/qt6/6.8.3/gcc_64
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.3 gcc_64 -O /opt/qt6

      - name: Verify Qt
        run: ls $QT_DIR/include/QtCore/qchar.h

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dqt6-extra-path=$QT_DIR -Dqt6-lib-path=$QT_DIR/lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: zig-out/
