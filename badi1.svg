<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Terminal Dark) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242F" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>

    <!-- Glassmorphism Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>

    <!-- Zig/Badi Fiery Orange Gradient -->
    <linearGradient id="badiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#F7A41D" /> <!-- Zig Orange -->
      <stop offset="100%" stop-color="#F9D423" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glowing Effect for the Spark (Initiator) -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle (Modern Linux/macOS standard) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Stroke (Glass Edge) -->
  <rect x="33" y="33" width="446" height="446" rx="111" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- App Symbol Group -->
  <g filter="url(#dropShadow)">
    
    <!-- 1. The Terminal Chevron (>) -->
    <path 
      d="M 110 180 L 170 240 L 110 300" 
      fill="none" 
      stroke="#E2E2ED" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- 2. The Arabic 'Ba' Body (ب) / Terminal Cursor (_) -->
    <!-- Starts on the right, sweeps down into a flat baseline, and caps off near the chevron -->
    <path 
      d="M 370 200 L 370 240 Q 370 280 330 280 L 240 280 Q 210 280 210 260" 
      fill="none" 
      stroke="url(#badiGrad)" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- 3. The Spark / Dot of the Ba (The Initiator) -->
  <!-- A perfectly balanced 4-point star hovering just below the baseline -->
  <path 
    d="M 285 305 Q 285 340 250 340 Q 285 340 285 375 Q 285 340 320 340 Q 285 340 285 305 Z" 
    fill="url(#badiGrad)" 
    filter="url(#glow)" 
  />

</svg>
