version: 1

script:
  - test -f zig-out/bin/badi || (echo "zig-out/bin/badi missing - run 'zig build' first" && exit 1)

  - rm -rf AppDir

  - install -Dm755 zig-out/bin/badi AppDir/usr/bin/badi
  - install -Dm644 assets/badi.desktop AppDir/usr/share/applications/badi.desktop
  - install -Dm644 assets/badi-256.png AppDir/usr/share/icons/hicolor/256x256/apps/badi.png
  - install -Dm644 assets/badi-512.png AppDir/usr/share/icons/hicolor/512x512/apps/badi.png

  - mkdir -p AppDir/usr/lib AppDir/usr/plugins/platforms
  - cp -Pv "${QT_ROOT_DIR}/lib/"libQt6Core.so*       AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libQt6Gui.so*        AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libQt6Widgets.so*    AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libQt6DBus.so*       AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libQt6XcbQpa.so*     AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libicui18n.so*       AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libicuuc.so*         AppDir/usr/lib/
  - cp -Pv "${QT_ROOT_DIR}/lib/"libicudata.so*       AppDir/usr/lib/
  - cp -v  "${QT_ROOT_DIR}/plugins/platforms/libqxcb.so" AppDir/usr/plugins/platforms/

AppDir:
  path: ./AppDir

  app_info:
    id: com.milkilabs.badi
    name: Badi
    icon: badi
    version: '{{VERSION}}'
    exec: usr/bin/badi
    exec_args: $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse'
      - sourceline: 'deb [arch=amd64] http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse'

    include:
      - libunwind8
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libglib2.0-0
      - libegl1
      - libgl1
      - libx11-6
      - libx11-xcb1
      - libzstd1

    exclude:
      - adduser
      - debconf
      - dpkg
      - libpam0g
      - libpam-modules
      - libpam-modules-bin
      - libpam-runtime
      - sysvinit-utils
      - tzdata
      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono

  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
      - usr/share/lintian
      - usr/share/locale

  runtime:
    env:
      QT_PLUGIN_PATH: '${APPDIR}/usr/plugins'
      QT_QPA_PLATFORM_PLUGIN_PATH: '${APPDIR}/usr/plugins/platforms'

AppImage:
  arch: x86_64
  file_name: Badi-{{VERSION}}-x86_64.AppImage
  update-information: gh-releases-zsync|milkiLabs|Badi|latest|*x86_64.AppImage.zsync
