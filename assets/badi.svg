<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Badi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a36"/>
      <stop offset="100%" stop-color="#1a2547"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7af0c2"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Subtle inner border for depth -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="none" stroke="#2a3a66" stroke-width="2" opacity="0.6"/>

  <!-- Chevron (>) symbol, the "launch/command" mark -->
  <g fill="url(#chev)" filter="url(#soft)" opacity="0.55">
    <path d="M 168 200 L 248 256 L 168 312 L 138 282 L 188 256 L 138 230 Z"/>
  </g>
  <path d="M 168 200 L 248 256 L 168 312 L 138 282 L 188 256 L 138 230 Z" fill="url(#chev)"/>

  <!-- Cursor block (the "_" — keystroke waiting to happen) -->
  <rect x="272" y="232" width="92" height="48" rx="6" fill="url(#cursor)"/>

  <!-- Tiny dot at the tip of the cursor to suggest a caret -->
  <circle cx="350" cy="256" r="6" fill="#1a2547"/>
</svg>
